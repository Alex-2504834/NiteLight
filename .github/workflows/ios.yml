name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      - name: Bundle React Native
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: Build archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace NiteLight.xcworkspace \
            -scheme NiteLight \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/NiteLight.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Create IPA
        working-directory: ios
        run: |
          mkdir Payload

          cp -R build/NiteLight.xcarchive/Products/Applications/NiteLight.app Payload/

          zip -r NiteLight.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NiteLight-IPA
          path: ios/NiteLight.ipa