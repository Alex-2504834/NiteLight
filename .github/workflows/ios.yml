name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: ios
        run: |
          rm -rf Pods
          rm -rf Podfile.lock

          pod install --repo-update

      - name: Clean build folders
        run: |
          rm -rf ios/build
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Bundle React Native
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: Verify iOS files
        run: |
          ls -la ios
          ls -la ios/NiteLight

          test -f ios/NiteLight/AppDelegate.swift
          test -d ios/NiteLight/Images.xcassets
          test -d ios/NiteLight/Colors.xcassets

      - name: Build app
        working-directory: ios
        run: |
          xcodebuild clean \
            -workspace NiteLight.xcworkspace \
            -scheme NiteLight

          xcodebuild \
            -workspace NiteLight.xcworkspace \
            -scheme NiteLight \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Verify build output
        run: |
          find ios/build -name "*.app"

      - name: Create IPA
        run: |
          mkdir Payload

          APP_PATH=$(find ios/build -name "NiteLight.app" | head -n 1)

          cp -R "$APP_PATH" Payload/

          zip -r NiteLight.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NiteLight-IPA
          path: NiteLight.ipa