name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace NiteLight.xcworkspace \
            -scheme NiteLight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir Payload

          cp -r ios/build/Build/Products/Release-iphoneos/NiteLight.app Payload/

          zip -r NiteLight.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NiteLight-IPA
          path: NiteLight.ipa