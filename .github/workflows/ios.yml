name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      SCHEME: NiteLight
      WORKSPACE: ios/NiteLight.xcworkspace
      BUNDLE_ID: com.yourcompany.nitelight
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Install signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=temporary

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_BASE64" | base64 --decode > ios_distribution.p12
          security import ios_distribution.p12 \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/NiteLight.mobileprovision"

      - name: Clean
        working-directory: ios
        run: xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME"

      - name: Archive
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="NiteLight Dev Profile"

      - name: Create ExportOptions.plist
        working-directory: ios
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>__TEAM_ID__</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>__BUNDLE_ID__</key>
              <string>NiteLight Dev Profile</string>
            </dict>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__TEAM_ID__/${TEAM_ID}/g" ExportOptions.plist
          sed -i '' "s/__BUNDLE_ID__/${BUNDLE_ID}/g" ExportOptions.plist

      - name: Export IPA
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/export/*.ipa